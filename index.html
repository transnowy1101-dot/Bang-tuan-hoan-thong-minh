<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng tuần hoàn thông minh</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--card:#0d1b2e;--line:#27415f;--txt:#eef5ff;--muted:#9fb2c9;--accent:#6ee7f7}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07111f,#10213a);color:var(--txt);font-family:system-ui,Arial,sans-serif}main{padding:24px;max-width:1500px;margin:auto}header{text-align:center;position:relative}h1{font-size:clamp(28px,4vw,44px);margin:8px}p{color:var(--muted)}.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px}.tools input,.tools select{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt)}#grid{display:grid;grid-template-columns:repeat(18,minmax(58px,1fr));gap:5px;overflow:auto}.el{background:var(--card);border:1px solid var(--line);border-top:3px solid #60a5fa;border-radius:8px;min-height:72px;color:var(--txt);text-align:left;padding:6px;cursor:pointer}.el:hover{border-color:var(--accent)}.z,.mass{font-size:10px;color:var(--muted)}.sym{font-size:23px;font-weight:800}.name{font-size:10px;overflow:hidden;text-overflow:ellipsis}.empty{visibility:hidden}.cat-hi{border-top-color:#34d399}.cat-kim{border-top-color:#f59e0b}.cat-phi{border-top-color:#60a5fa}.label{grid-column:1/-1;color:var(--muted);padding:8px}.legend{text-align:center;color:var(--muted);margin:16px}.modal{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;padding:14px;overflow:auto}.modal.show{display:flex}.panel{background:#0d1b2e;border:1px solid var(--line);border-radius:18px;padding:22px;width:min(600px,100%);max-height:95vh;overflow:auto;position:relative}.close{float:right;font-size:24px;background:none;border:0;color:var(--txt);cursor:pointer}.fields{display:grid;gap:10px}.fields label{font-size:13px;color:var(--muted)}textarea{width:100%;min-height:68px;background:#081626;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}.save{padding:11px 15px;border-radius:9px;background:#164e63;color:white;border:1px solid #2b7890;cursor:pointer}.status{font-size:12px;color:var(--muted)}@media(max-width:700px){main{padding:12px}#grid{min-width:1100px}.table-wrap{overflow:auto}}
.fact{display:flex;flex-direction:column;gap:6px;line-height:1.5;padding:14px}
.fact b{display:block;font-size:13px;margin-bottom:4px;line-height:1.5}
.facts{gap:12px}
.editbox{margin-top:24px;display:grid;gap:14px}
.editbox label{display:block;margin-bottom:4px;line-height:1.6}
.qr-preview{max-width:180px;margin-top:8px;border-radius:8px;border:1px solid var(--line);background:white;padding:4px}
.file-input-box{background:#081626;border:1px dashed var(--line);padding:12px;border-radius:9px;text-align:center}
.visitor-badge{position:absolute;top:0;right:0;font-size:12px;color:var(--muted);background:var(--card);padding:8px 14px;border-radius:20px;border:1px solid var(--line);display:flex;align-items:center;gap:6px}@media(max-width:768px){.visitor-badge{position:static;margin-bottom:12px;display:inline-flex}}
</style>
</head>
<body>
<main>
  <header>
    <div class="visitor-badge" id="visitorCount">👁️ Lượt xem: Đang tải...</div>
    <h1>⚛️ Bảng tuần hoàn thông minh</h1>
    <p>Bấm vào nguyên tố để xem và cùng cập nhật thông tin. Dữ liệu được lưu chung trên Supabase.</p>
    <div class="tools">
      <input id="search" placeholder="🔎 Tìm tên, kí hiệu, số nguyên tử">
      <select id="filter">
        <option value="all">Tất cả</option>
        <option>Kim loại</option>
        <option>Phi kim</option>
        <option>Khí hiếm</option>
      </select>
    </div>
    <p id="status" class="status">Đang kết nối dữ liệu…</p>
  </header>
  <div class="table-wrap"><div id="grid"></div></div>
  <div class="legend">🟠 Kim loại  🔵 Phi kim  🟢 Khí hiếm</div>
</main>
<div id="modal" class="modal"><section class="panel"><button id="close" class="close">×</button><div id="details"></div></section></div>

const elements = raw.trim().split('\n').map((s, i) => {
  let [symbol, name, mass, category, period, group, state] = s.split('|');
  let z = i + 1;
  if (z === 108) mass = '270';
  if (z === 112) state = 'Lỏng hoặc khí';
  if (z === 118) state = 'Rắn';
  return { z, symbol, name, mass, category, period: +period, group: +group, state };
});

let shared = {};
const $ = id => document.getElementById(id);
const grid = $('grid'), modal = $('modal'), details = $('details');

function css(e) {
  return e.category === 'Khí hiếm' ? 'cat-hi' : e.category === 'Phi kim' ? 'cat-phi' : 'cat-kim';
}

function card(e) {
  return `<button class="el ${css(e)}" data-z="${e.z}"><div class="z">${e.z}</div><div class="sym">${e.symbol}</div><div class="name">${e.name}</div><div class="mass">${e.symbol === 'Cl' ? '35,5' : Math.round(Number(e.mass))}</div></button>`;
}

function groupCard(rangeText, titleText) {
  return `<div class="el cat-kim" style="cursor:default;padding:4px"><div class="z" style="font-size:10px;font-weight:bold">${rangeText}</div><div class="sym" style="font-size:14px;font-weight:700;margin-top:8px;text-align:center">${titleText}</div></div>`;
}

function eIsSeparate(z) {
  return (z >= 58 && z <= 71) || (z >= 90 && z <= 103);
}

function formatGroup(g) {
  const map = {
    1: 'IA', 2: 'IIA',
    3: 'IIIB', 4: 'IVB', 5: 'VB', 6: 'VIB', 7: 'VIIB',
    8: 'VIIIB', 9: 'VIIIB', 10: 'VIIIB',
    11: 'IB', 12: 'IIB',
    13: 'IIIA', 14: 'IVA', 15: 'VA', 16: 'VIA', 17: 'VIIA', 18: 'VIIIA'
  };
  return map[g] ? map[g] : String(g);
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const f = $('filter').value;
  grid.innerHTML = '';

  for (let p = 1; p <= 7; p++) {
    for (let c = 1; c <= 18; c++) {
      const d = document.createElement('div');
      if (p === 6 && c === 3) {
        if (!q && (f === 'all' || f === 'Kim loại')) {
          d.innerHTML = groupCard('57 - 71', 'Lantan');
        } else {
          d.className = 'empty';
        }
        grid.appendChild(d);
        continue;
      }
      if (p === 7 && c === 3) {
        if (!q && (f === 'all' || f === 'Kim loại')) {
          d.innerHTML = groupCard('89 - 103', 'Actini');
        } else {
          d.className = 'empty';
        }
        grid.appendChild(d);
        continue;
      }

      const e = elements.find(x => {
        if (x.period !== p || x.group !== c) return false;
        if (eIsSeparate(x.z)) return false;
        return true;
      });

      if (e && (!q || String(e.z) === q || e.symbol.toLowerCase().includes(q) || e.name.toLowerCase().includes(q)) && (f === 'all' || e.category === f)) {
        d.innerHTML = card(e);
      } else {
        d.className = 'empty';
      }
      grid.appendChild(d);
    }
  }

  for (const [label, a, b] of [['Lantan', 57, 71], ['Actini', 89, 103]]) {
    const l = document.createElement('div');
    l.className = 'label';
    l.textContent = label + ' (dãy riêng)';
    grid.appendChild(l);

    for (let z = a; z <= b; z++) {
      const e = elements[z - 1];
      const d = document.createElement('div');
      if (e && (!q || String(e.z) === q || e.symbol.toLowerCase().includes(q) || e.name.toLowerCase().includes(q)) && (f === 'all' || e.category === f)) {
        d.innerHTML = card(e);
      } else {
        d.className = 'empty';
      }
      grid.appendChild(d);
    }
  }

  document.querySelectorAll('.el[data-z]').forEach(b => {
    b.onclick = () => openElement(+b.dataset.z);
  });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function openElement(z) {
  const e = elements[z - 1];
  const s = shared[z] || {};
  const noteTitle = (z >= 107 && z <= 118) ? "<br><span style='font-size:11px;color:var(--muted);font-weight:normal'>(dự đoán vì chỉ tồn tại vài nguyên tử trong vài mi-li-giây, khiến việc đo đạc bất khả thi)</span>" : "";

  details.innerHTML = `
    <div class="element-header">
      <div class="sym" style="font-size:48px">${escapeHtml(e.symbol)}</div>
      <div>
        <h2>${escapeHtml(e.name)}</h2>
        <p>Nguyên tố số ${z}</p>
      </div>
    </div>
    <h3>📘 6 thông tin cơ bản</h3>
    <div class="facts">
      <div class="fact"><b>Số hiệu nguyên tử</b>${z}</div>
      <div class="fact"><b>Khối lượng nguyên tử</b>${escapeHtml(String(e.mass ?? "Chưa có dữ liệu"))}</div>
      <div class="fact"><b>Phân loại${noteTitle}</b>${escapeHtml(e.category ?? "Chưa có dữ liệu")}</div>
      <div class="fact"><b>Chu kỳ</b>${escapeHtml(String(e.period ?? "Chưa có dữ liệu"))}</div>
      <div class="fact"><b>Nhóm</b>${escapeHtml(formatGroup(e.group))}</div>
      <div class="fact"><b>Trạng thái ở điều kiện thường${noteTitle}</b>${escapeHtml(e.state ?? "Chưa có dữ liệu")}</div>
    </div>
    <h3>🧪 Thông tin bổ sung & Infographic</h3>
    <div class="editbox">
      <label>Cấu hình electron<textarea id="electronInput">${escapeHtml(s.electron_config || "")}</textarea></label>
      <label>Tính chất vật lí${noteTitle}<textarea id="physicalInput">${escapeHtml(s.physical_properties || "")}</textarea></label>
      <label>Tính chất hoá học${noteTitle}<textarea id="chemicalInput">${escapeHtml(s.chemical_properties || "")}</textarea></label>
      <label>Fun facts<textarea id="funInput">${escapeHtml(s.fun_facts || "")}</textarea></label>
      
      <label>Mã QR của Infographic (Chọn ảnh từ thiết bị)</label>
      <div class="file-input-box">
        <input type="file" id="qrFile" accept="image/*" style="width:100%;color:var(--txt)">
      </div>
      <input type="hidden" id="qrInput" value="${escapeHtml(s.qr_image_url || "")}">

      <div id="qrPreviewContainer">
        ${s.qr_image_url ? `<p style="font-size:12px;color:var(--muted);margin-top:8px;margin-bottom:4px">Mã QR hiện tại:</p><img src="${escapeHtml(s.qr_image_url)}" class="qr-preview" crossorigin="anonymous">` : ''}
      </div>

      <button id="save" class="save" style="margin-top:10px">💾 Lưu thông tin chung</button>
      <p id="saveStatus" class="status"></p>
    </div>
  `;

  document.getElementById("qrFile").onchange = async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;

    const status = document.getElementById("saveStatus");
    status.textContent = "⏳ Đang tải ảnh lên Storage...";

    const fileName = `qr_${z}_${Date.now()}.${file.name.split('.').pop()}`;

    try {
      const { data, error } = await db.storage
        .from('qr-images')
        .upload(fileName, file);

      if (error) throw error;

      const { data: publicURLData } = db.storage
        .from('qr-images')
        .getPublicUrl(fileName);

      const publicUrl = publicURLData.publicUrl;

      document.getElementById("qrInput").value = publicUrl;
      document.getElementById("qrPreviewContainer").innerHTML = `
        <p style="font-size:12px;color:var(--muted);margin-top:8px;margin-bottom:4px">Mã QR mới chọn (chưa lưu):</p>
        <img src="${publicUrl}" class="qr-preview">
      `;
      status.textContent = "✅ Tải ảnh lên thành công! Bấm 'Lưu thông tin chung' để hoàn tất.";
    } catch (err) {
      status.textContent = "❌ Lỗi tải ảnh: " + err.message;
    }
  };

  document.getElementById("save").onclick = async () => {
    const row = {
      atomic_number: z,
      electron_config: document.getElementById("electronInput").value,
      physical_properties: document.getElementById("physicalInput").value,
      chemical_properties: document.getElementById("chemicalInput").value,
      fun_facts: document.getElementById("funInput").value,
      qr_image_url: document.getElementById("qrInput").value,
      updated_at: new Date().toISOString()
    };

    const status = document.getElementById("saveStatus");
    const button = document.getElementById("save");
    status.textContent = "Đang lưu...";
    button.disabled = true;

    try {
      const { error } = await db.from("elements_info").upsert(row, { onConflict: "atomic_number" });
      if (error) throw error;
      shared[z] = row;
      status.textContent = "✅ Đã lưu thông tin chung và mã QR thành công!";
    } catch (error) {
      status.textContent = "❌ Lỗi lưu: " + error.message;
    } finally {
      button.disabled = false;
    }
  };

  modal.classList.add("show");
}

async function load() {
  try {
    const { data, error } = await db.from('elements_info').select('*');
    if (error) throw error;
    shared = {};
    (data || []).forEach(r => shared[r.atomic_number] = r);
    $('status').textContent = '✅ Đã kết nối Supabase · ' + data.length + ' nguyên tố đã có dữ liệu chung';
  } catch (err) {
    console.error(err);
    $('status').textContent = '❌ Lỗi kết nối Supabase: ' + (err.message || 'Kiểm tra lại cấu hình');
  }
}

// Hàm lấy và tự động tăng lượt truy cập trực tiếp từ Supabase
async function updateVisitorCount() {
  try {
    // Lấy số lượt xem hiện tại từ bảng site_stats
    let { data, error } = await db.from('site_stats').select('visits').eq('id', 1).single();
    let currentVisits = (data && data.visits) ? data.visits + 1 : 1;

    // Cập nhật lại số lượng tăng lên 1 vào Supabase
    await db.from('site_stats').upsert({ id: 1, visits: currentVisits });

    $('visitorCount').innerHTML = `👁️ Lượt xem: ${currentVisits.toLocaleString()}`;
  } catch (e) {
    console.error(e);
    $('visitorCount').innerHTML = `👁️ Lượt xem: Đang cập nhật`;
  }
}

$('search').oninput = render;
$('filter').onchange = render;
$('close').onclick = () => modal.classList.remove('show');
modal.onclick = e => { if (e.target === modal) modal.classList.remove('show'); };

render();
load();
updateVisitorCount();
</script>
